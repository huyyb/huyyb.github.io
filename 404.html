<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Page not found</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#091421" media="(prefers-color-scheme: dark)">
  <script>
    // Match the theme saved on the main page. No other JS here.
    try {
      var t = JSON.parse(localStorage.getItem('hb.prefs') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>

<body>
  <div data-page="404">
    <main>
      <div class="card-head">
        <h2 class="label">
          Error</h2>
        <span class="count-mono">404</span>
      </div>
      <div class="error-body">
        <h1 class="heading-lg">
          Page not found</h1>
        <p class="error-lead">
          That address doesn't exist here. It may have moved, or it may never have existed.</p>
        <a href="/" class="hv-fill btn-home">Back
          home<span aria-hidden="true" class="accent">→</span></a>
      </div>
    </main>
  </div>
</body>

</html>
