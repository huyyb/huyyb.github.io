<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png. Regenerate with the Chrome headless command in README.md. -->
  <!-- IBM Plex comes from Google Fonts, so rendering needs a network connection. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;700&amp;display=block');
    .sans{font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif}
    .mono{font-family:'IBM Plex Mono',Menlo,monospace}
  </style>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#e2e7eb" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f3f6f8"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="80" y="86" width="14" height="14" fill="#cc3430"/>
  <text x="110" y="99" class="mono" font-size="20" font-weight="500" letter-spacing="3" fill="#6f7983">SOFTWARE BUILDER</text>

  <text x="72" y="292" class="sans" font-size="150" font-weight="700" letter-spacing="-5" fill="#14202d">Huy Bui<tspan fill="#cc3430">.</tspan></text>
  <text x="80" y="366" class="sans" font-size="34" font-weight="500" fill="#14202d">Senior / lead software engineer</text>
  <text x="80" y="414" class="sans" font-size="34" font-weight="400" fill="#6f7983">Low-code · Workflows · AI in the loop</text>

  <rect x="808" y="86" width="312" height="312" fill="#f2f6f9" stroke="#c9d0d6" stroke-width="1"/>
  <image x="809" y="87" width="310" height="310" href="profile.png"/>
  <g stroke="#14202d" stroke-width="2" stroke-linecap="square">
    <path d="M1120 62v14M1120 96v14M1096 86h14M1130 86h14"/>
  </g>

  <line x1="80" y1="500" x2="1120" y2="500" stroke="#c9d0d6" stroke-width="1"/>
  <text x="80" y="550" class="mono" font-size="24" font-weight="500" fill="#14202d">huyyb.github.io</text>
  <text x="1120" y="550" text-anchor="end" class="mono" font-size="24" font-weight="400" fill="#6f7983">Ho Chi Minh City · UTC+7</text>
</svg>
